apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kuma-gateway
  labels:
    app.kubernetes.io/name: kuma-gateway
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: uptime-kuma-app
    cloudman.io/creator: Contato-Struct
  namespace: kuma
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  gatewayClassName: kong-gateway-class
  listeners:
    - name: kuma-http
      port: 80
      protocol: HTTP
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
