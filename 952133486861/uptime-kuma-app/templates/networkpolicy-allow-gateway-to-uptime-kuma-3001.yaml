apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-uptime-kuma-3001
  namespace: kuma
  labels:
    app.kubernetes.io/name: allow-gateway-to-uptime-kuma-3001
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: uptime-kuma-app
    cloudman.io/creator: Contato-Struct
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kuma
      ports:
        - protocol: TCP
          port: 3001
