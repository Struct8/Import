apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  labels:
    app.kubernetes.io/name: uptime-kuma
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: uptime-kuma-app
    cloudman.io/creator: Contato-Struct
  namespace: kuma
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      serviceAccountName: deployment-uptime-kuma-v1-sa
      containers:
        - image: "louislam/uptime-kuma:2"
          imagePullPolicy: IfNotPresent
          name: uptime-kuma
          ports:
            - containerPort: 3001
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
    metadata:
      labels:
        app.kubernetes.io/name: uptime-kuma
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
