apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kuma-route-uptime-kuma
  namespace: kuma
  labels:
    struct8.io/origin: kuma-route
    app.kubernetes.io/name: kuma-route-uptime-kuma
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: uptime-kuma-app
    cloudman.io/creator: Contato-Struct
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  parentRefs:
    - name: kuma-gateway
      namespace: kuma
      sectionName: kuma-http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kuma-svc
          namespace: kuma
          port: 80
