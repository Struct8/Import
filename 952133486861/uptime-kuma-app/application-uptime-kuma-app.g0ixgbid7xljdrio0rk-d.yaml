apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uptime-kuma-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: uptime-kuma-app
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: uptime-kuma-app
    cloudman.io/creator: Contato-Struct
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: kuma
  source:
    repoURL: "https://github.com/Struct8/import"
    targetRevision: HEAD
    path: 952133486861/uptime-kuma-app/templates
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kuma
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
